name: Edvora Foundation CI

on:
  push:
    branches:
      - main
      - feature/edvora-v0.0.1-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edvora-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, pdo_sqlite, dom, xml, fileinfo, curl
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install exact locked PHP dependencies
        run: |
          test -s composer.lock
          composer install --prefer-dist --no-interaction --no-progress
          composer validate --no-check-publish
      - name: Configure isolated testing app
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: PHP syntax and installation preflight
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
          bash support/qa/preflight.sh
      - name: Test tenant isolation and authentication
        run: php artisan test --stop-on-failure
      - name: Verify route cache
        run: |
          php artisan route:cache
          php artisan route:clear
      - name: Composer dependency audit
        run: composer audit --no-interaction

  frontend:
    name: Tailwind build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact locked frontend dependencies
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit
      - run: npm run build

  mysql:
    name: MySQL 8 schema acceptance
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: edvora_ci
          MYSQL_USER: edvora_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, dom, xml, fileinfo
          tools: composer:v2
      - run: |
          test -s composer.lock
          composer install --prefer-dist --no-interaction --no-progress
      - name: Install into isolated CI MySQL database
        env:
          APP_ENV: testing
          APP_DEBUG: false
          APP_KEY: ''
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: edvora_ci
          DB_USERNAME: edvora_ci
          DB_PASSWORD: ci-only-password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          export APP_KEY="$(php artisan key:generate --show)"
          php artisan migrate --force
          php artisan db:seed --class=RoleSeeder --force
          php artisan migrate:status
